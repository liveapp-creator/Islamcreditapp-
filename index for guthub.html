</style></head><body>
<div id="L"><div class="lg"><h1>ISLAM AND CO</h1><p class="sub">Beverage Company</p>

</main><footer class="ft">Software by Raja®</footer></div><div id="pw"><div class="tb"><button onclick="window.print()">🖨 Print</button><button class="g" onclick="$('pw').classList.remove('on')">Close</button></div><div id="pr"></div></div><datalist id="pl"></datalist>
<script>
const API='https://script.google.com/macros/s/AKfycbx_nzF6KrQn1etbSml7j7R2QAWcn_jMYR1BTMrTIooKzLr_wjiyIK9kZZ4vzdioWVuO/exec';
const $=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),N=x=>+x||0,F=x=>N(x).toLocaleString();
const td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),nowS=()=>td()+' '+new Date().toTimeString().slice(0,5);
const cmp=(a,b)=>a.Date<b.Date?-1:a.Date>b.Date?1:a.ID-b.ID;
let busy=false;let S=JSON.parse(sessionStorage.s||'null'),D=JSON.parse(localStorage.D||'{"o":[],"e":[],"b":[],"u":[],"n":""}'),editO=null,T={},EM={},OM={},H=null,BR=[];
function build(){T={};EM={};OM={};D.o.forEach(o=>{OM[o.ID]=o;T[o.ID]={u:N(o.Opening),w:0}});D.e.forEach(e=>{(EM[e.OutletID]=EM[e.OutletID]||[]).push(e);const t=T[e.OutletID];if(t){t.u+=N(e.Credit);t.w+=N(e.Wasooli)}})}
const tot=id=>{const t=T[id]||{u:0,w:0};return{u:t.u,w:t.w,r:t.u-t.w}},ent=id=>EM[id]||[];
function save(){try{localStorage.D=JSON.stringify(D)}catch(e){}}
async function call(a,x={}){const c=new AbortController(),tm=setTimeout(()=>c.abort(),45000);try{const r=await fetch(API,{method:'POST',signal:c.signal,body:JSON.stringify({a,u:S.u,p:S.p,...x})});return await r.json()}finally{clearTimeout(tm)}}
async function login(){S={u:$('lu').value.trim(),p:$('lp').value};$('lm').style.color='#555';$('lm').textContent='Data load ho raha hai, thora intezar karein...';$('lb').disabled=true;$('lb').textContent='Login... Please wait';
try{const r=await call('login');if(!r.ok){$('lm').style.color='#c0392b';$('lm').textContent=r.msg;S=null;$('lb').disabled=false;$('lb').textContent='Login';return}S.name=r.name;S.role=r.role;sessionStorage.s=JSON.stringify(S);D=r.d;save();start();wel()}catch(e){S=null;$('lm').style.color='#c0392b';$('lm').textContent='Internet/URL masla'}$('lb').disabled=false;$('lb').textContent='Login';if(S)$('lm').textContent=''}
function wel(){const w=$('wl');w.innerHTML=`<div><h1 style="letter-spacing:4px;margin:0">ISLAM AND CO</h1><p style="margin:4px 0 28px;letter-spacing:3px;font-size:13px">BEVERAGE COMPANY</p><h2>Welcome, ${E(S.name)}!</h2><p style="opacity:.8;font-size:12px;margin-top:30px">Software by Raja®</p></div>`;w.classList.remove('hid');setTimeout(()=>w.classList.add('hid'),2200)}
function logout(){sessionStorage.clear();localStorage.removeItem('D');S=null;D={o:[],e:[],b:[],u:[],n:''};build();$('A').classList.add('hid');$('L').classList.remove('hid');$('lp').value='';$('lm').textContent=''}
async function sync(){if(!S)return;try{const r=await call('data');if(r.ok&&S){D=r.d;save();build();render()}}catch(e){}}
function loc(a,x){const k={Outlets:'o',Entries:'e',Bills:'b',Users:'u'}[x.s],i0=x.s=='Users'?'UserName':'ID';if(!k)return;
if(a=='add')D[k].push(x.row);else if(a=='del')D[k]=D[k].filter(r=>String(r[i0])!=String(x.id));else if(a=='upd'){const r=D[k].find(r=>String(r[i0])==String(x.id));r&&Object.assign(r,x.row)}build();render()}
async function op(a,x){loc(a,x);try{const r=await call(a,x);if(!r.ok){alert(r.msg||'Error');await sync();return false}sync();return true}catch(e){alert('Internet nahi hai - save nahi hua');try{D=JSON.parse(localStorage.D)}catch(e){}build();render();return false}}
const tabs=[['d','🏠 Dashboard'],['o','🏪 Shops'],['h','📜 History'],['b','🧾 Bill']];
function start(){build();$('L').classList.add('hid');$('A').classList.remove('hid');$('who').textContent=S.name+' ('+S.role+')';
if(S.role=='Admin'&&!tabs.find(t=>t[0]=='a'))tabs.push(['a','⚙️ Admin']);$('nav').innerHTML=tabs.filter(t=>t[0]!='a'||S.role=='Admin').map(t=>`<button id="n_${t[0]}" onclick="tab('${t[0]}')">${t[1]}</button>`).join('');
$('edt').value=td();$('os').value=S.name;$('bu').textContent=S.name;const m=td().slice(0,8)+'01';['hf','bsf'].forEach(i=>$(i).value=m);['ht','bst'].forEach(i=>$(i).value=td());
if(!$('bit').children.length)addI();$('rf').value=$('rt').value=td();tab('d');render();sync()}
function tab(k){tabs.forEach(t=>{const e=$('t_'+t[0]);if(e){e.classList.toggle('hid',t[0]!=k);$('n_'+t[0])&&($('n_'+t[0]).className=t[0]==k?'on':'')}})}
function sug(i,b,cb){const q=$(i).value.trim().toLowerCase(),B=$(b);if(!q){B.innerHTML='';cb&&window[cb]();return}
const m=D.o.filter(o=>String(o.ID).toLowerCase().includes(q)||String(o.Name).toLowerCase().includes(q)||String(o.Phone).includes(q)).slice(0,6);
B.innerHTML=m.map(o=>`<div class="sg" data-v="${E(o.ID)}" onclick="pick(this,'${i}','${b}','${cb||''}')"><b>${E(o.ID)}</b> - ${E(o.Name)} <small>${E(o.Address)}</small></div>`).join('');cb&&window[cb]()}
function pick(el,i,b,cb){$(i).value=el.dataset.v;$(b).innerHTML='';if(cb)window[cb]()}
const bal=r=>r<0?`<span class="grn">${F(-r)} Advance</span>`:`<span class="red">${F(r)}</span>`;
function render(){if(!S)return;$('ann').innerHTML=D.n?`<span>📢 ${E(D.n)}</span>`:'';let u=0,w=0;for(const k in T){u+=T[k].u;w+=T[k].w}
$('s1').textContent=F(u);$('s2').textContent=F(w);$('s3').textContent=F(u-w);
re();rl();bh();const ps=new Set();D.b.slice(-100).forEach(b=>{try{bparse(b).it.forEach(x=>ps.add(x.p))}catch(e){}});$('pl').innerHTML=[...ps].map(p=>`<option value="${E(p)}">`).join('');
if(S.role=='Admin'){if(document.activeElement!=$('an'))$('an').value=D.n;$('ul').innerHTML='<table><tr><th>User<th>Status<th></tr>'+D.u.map(x=>`<tr><td>${E(x.UserName)}<br><small>${E(x.FullName)} ${x.Role}</small><td>${x.Status}<td><button onclick="tgl('${E(x.UserName)}','${x.Status}')">${x.Status=='Active'?'Block':'Activate'}</button> <button class="g" onclick="rpw('${E(x.UserName)}')">Pass</button> <button class="r" onclick="del('Users','${E(x.UserName)}')">X</button></tr>`).join('')+'</table>'}}
function re(){if(!S)return;const f=$('rf').value,t=$('rt').value,m=D.e.filter(e=>(!f||e.Date>=f)&&(!t||e.Date<=t)).sort((a,b)=>b.ID-a.ID);let c=0,w=0;m.forEach(e=>{c+=N(e.Credit);w+=N(e.Wasooli)});
$('rsum').innerHTML=`${m.length} entries | Credit: <b>${F(c)}</b> | Wasooli: <b class="grn">${F(w)}</b>`;
$('rec').innerHTML='<table><tr><th>Date<th>Shop<th>Credit<th>Wasooli<th>Remarks<th></tr>'+m.slice(0,100).map(e=>`<tr><td>${e.Date}<td>${E((OM[e.OutletID]||{}).Name)}<td>${F(e.Credit)}<td>${F(e.Wasooli)}<td>${E(e.Remarks)}<td><button class="r" onclick="del('Entries',${e.ID})">X</button></tr>`).join('')+'</table>'+(m.length>100?'<small>Pehli 100 dikh rahi hain, date range chhoti karein</small>':'')}
function eInfo(){const o=OM[$('eid').value.trim()];$('einf').innerHTML=o?`<b>${E(o.Name)}</b> | ${E(o.Salesman)} | Remaining: ${bal(tot(o.ID).r)}`:''}
async function saveE(){const id=$('eid').value.trim();if(!OM[id])return alert('Pehle list se shop select karein');
const c=N($('ecr').value),w=N($('ewa').value);if(!c&&!w)return alert('Credit ya Wasooli likhein');
if(busy)return;busy=true;const ok=await op('add',{s:'Entries',row:{ID:Date.now(),Date:$('edt').value||td(),OutletID:id,Credit:c,Wasooli:w,Remarks:$('erm').value,AddedBy:S.u}});busy=false;if(ok){['ecr','ewa','erm'].forEach(i=>$(i).value='');eInfo()}}
function del(s,id){if(confirm('Delete karna hai?'))op('del',{s,id})}
function rl(){const q=$('osr').value.trim().toLowerCase();let m=q?D.o.filter(o=>(o.ID+' '+o.Name+' '+o.Phone).toLowerCase().includes(q)):D.o;const n=m.length;m=m.slice(0,6);
$('olist').innerHTML=`<small>Total ${D.o.length} shops | ${n>6?'6 dikh rahi hain, baqi search se milengi':n+' mili'}</small><table><tr><th>ID<th>Shop<th>Remaining<th></tr>`+m.map(o=>`<tr><td>${E(o.ID)}<td>${E(o.Name)}<br><small>${E(o.Address)} | ${E(o.Phone)} | ${E(o.Salesman)}</small><td>${bal(tot(o.ID).r)}<td><button onclick="editOf('${E(o.ID)}')">Edit</button> <button class="r" onclick="del('Outlets','${E(o.ID)}')">X</button></tr>`).join('')+'</table>'}
async function saveO(){const row={ID:$('oi').value.trim(),Name:$('on').value,Address:$('oa').value,Phone:$('op').value,Salesman:$('os').value,Opening:N($('oo').value),AddedBy:S.u};
if(!row.ID||!row.Name)return alert('ID aur Name zaruri');if(!editO&&OM[row.ID])return alert('Ye ID pehle se hai');let ok;if(editO){delete row.AddedBy;ok=await op('upd',{s:'Outlets',id:editO,row})}else ok=await op('add',{s:'Outlets',row});if(ok)clrO()}
function editOf(id){const o=OM[id];editO=id;$('ot').textContent='Edit Shop';$('oi').value=o.ID;$('on').value=o.Name;$('oa').value=o.Address;$('op').value=o.Phone;$('os').value=o.Salesman;$('oo').value=o.Opening;scrollTo(0,0)}
function clrO(){editO=null;$('ot').textContent='New Shop';['oi','on','oa','op','oo'].forEach(i=>$(i).value='');$('os').value=S.name}
function hist(){const id=$('hid').value.trim(),f=$('hf').value,t=$('ht').value,inR=e=>(!f||e.Date>=f)&&(!t||e.Date<=t);let h='';
if(id){const o=OM[id];if(!o){$('hout').innerHTML='<div class="c">Shop nahi mili</div>';return}const T0=tot(id),all=[...ent(id)].sort(cmp);let r=N(o.Opening);all.filter(e=>f&&e.Date<f).forEach(e=>r+=N(e.Credit)-N(e.Wasooli));
const ob=r,cur=all.filter(inR);let pc=0,pw=0;const L=[['Date','Credit','Wasooli','Remarks','Balance']],rows=cur.map(e=>{pc+=N(e.Credit);pw+=N(e.Wasooli);r+=N(e.Credit)-N(e.Wasooli);L.push([e.Date,e.Credit,e.Wasooli,e.Remarks,r]);return`<tr><td>${e.Date}<td>${F(e.Credit)}<td>${F(e.Wasooli)}<td>${E(e.Remarks)}<td>${F(r)}</tr>`}).join('');
H={csv:[['Shop',o.Name],['ID',o.ID],['Address',o.Address],['Phone',o.Phone],['Period',f+' to '+t],['Balance Before Period',ob],['Period Credit',pc],['Period Wasooli',pw],['Total Udhar (Overall)',T0.u],['Total Wasooli (Overall)',T0.w],['Remaining (Overall)',T0.r],[],...L]};
h=`<div class="c"><b>${E(o.Name)}</b> (${E(o.ID)})<br>${E(o.Address)} | ${E(o.Phone)} | Salesman: ${E(o.Salesman)}</div>
<div class="cards"><div>Total Udhar<b>${F(T0.u)}</b></div><div>Total Wasooli<b class="grn">${F(T0.w)}</b></div><div>Remaining<b>${bal(T0.r)}</b></div></div><br>
<div class="c"><small>Period: Credit ${F(pc)} | Wasooli ${F(pw)} | Pehle ka balance ${F(ob)}</small><div class="sc"><table><tr><th>Date<th>Credit<th>Wasooli<th>Remarks<th>Balance</tr>${rows||'<tr><td colspan=5>Is date range mein record nahi</tr>'}</table></div></div>`}
else{const cur=D.e.filter(inR).sort(cmp);let pc=0,pw=0;const L=[['Date','OutletID','Shop','Credit','Wasooli','Remarks']];cur.forEach(e=>{pc+=N(e.Credit);pw+=N(e.Wasooli);L.push([e.Date,e.OutletID,(OM[e.OutletID]||{}).Name,e.Credit,e.Wasooli,e.Remarks])});
H={csv:[['Period',f+' to '+t],['Credit',pc],['Wasooli',pw],[],...L]};
h=`<div class="cards"><div>Entries<b>${cur.length}</b></div><div>Credit<b>${F(pc)}</b></div><div>Wasooli<b class="grn">${F(pw)}</b></div></div><br><div class="c sc"><small>${cur.length>300?'Aakhri 300 dikh rahi hain, Excel mein poori':''}</small><table><tr><th>Date<th>Shop<th>Credit<th>Wasooli<th>Remarks</tr>${cur.slice(-300).map(e=>`<tr><td>${e.Date}<td>${E((OM[e.OutletID]||{}).Name)}<td>${F(e.Credit)}<td>${F(e.Wasooli)}<td>${E(e.Remarks)}</tr>`).join('')}</table></div>`}
$('hout').innerHTML=h}
function dl(n,L){if(!L)return alert('Pehle Search dabayein');const t='\ufeff'+L.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=n+'_'+td()+'.csv';a.click()}
function bInfo(){const o=OM[$('bid').value.trim()];if(o){$('bname').value=o.Name;$('baddr').value=o.Address;$('bph').value=o.Phone;$('binf').innerHTML='Remaining: '+bal(tot(o.ID).r)}else $('binf').innerHTML=''}
function bInfoOld(){const o=OM[$('bid').value.trim()];$('binf').innerHTML=o?`<b>${E(o.Name)}</b><br>${E(o.Address)} | ${E(o.Phone)} | Remaining: ${bal(tot(o.ID).r)}`:''}
function addI(){const d=document.createElement('div');d.className='bi';d.style.cssText='border:1px solid #ddd;border-radius:6px;padding:6px;margin:6px 0';
d.innerHTML='<input placeholder="Product name" list="pl"><div class="row"><input type="number" inputmode="decimal" placeholder="Qty" oninput="calc()"><input type="number" inputmode="decimal" placeholder="Price" oninput="calc()"><input readonly placeholder="Amount"><button class="r" style="flex:0 0 auto;min-width:0" onclick="this.closest(\'.bi\').remove();calc()">✕</button></div>';$('bit').appendChild(d)}
function items(){return[...document.querySelectorAll('.bi')].map(r=>{const i=r.querySelectorAll('input');const a=N(i[1].value)*N(i[2].value);i[3].value=a||'';return{p:i[0].value,q:N(i[1].value),r:N(i[2].value),a}}).filter(x=>x.p&&x.a)}
function calc(){$('btot').value=items().reduce((a,x)=>a+x.a,0)-N($('bdi').value)}
setInterval(()=>{if($('clk'))$('clk').textContent=nowS()},1000);setInterval(()=>{if(!document.hidden)sync()},60000);
function bparse(r){let x;try{x=JSON.parse(r.Items)}catch(e){x=[]}return Array.isArray(x)?{it:x,addr:'',ph:''}:{it:x.i||[],addr:x.a||'',ph:x.p||''}}
function pb(b){const sub=b.items.reduce((a,x)=>a+x.a,0);
const cp=n=>`<div class="cp"><h1>ISLAM AND CO</h1><div class="bs2">Choa Saidan Shah</div>
<div class="bt"><span>RECEIPT</span><span>${b.no}</span></div><div class="bs2" style="margin-bottom:4px">${n}</div>
<div style="margin-bottom:5px">Shop: <b>${E(b.Shop)}</b>${b.ShopID?' (ID: '+E(b.ShopID)+')':''}<br>${E(b.addr)}${b.ph?'<br>Phone: '+E(b.ph):''}</div>
<table style="width:100%"><tr><th>Product<th>Qty<th>Price<th>Amount</tr>${b.items.map(x=>`<tr><td>${E(x.p)}<td>${x.q}<td>${F(x.r)}<td style="text-align:right">${F(x.a)}</tr>`).join('')}</table>
<table style="width:100%"><tr><td>Sub Total<td style="text-align:right">${F(sub)}</tr><tr><td>Discount<td style="text-align:right">- ${F(b.ds)}</tr><tr><td><b>TOTAL</b><td style="text-align:right"><b>${F(sub-b.ds)}</b></tr></table>
<div style="font-size:10px;border-top:1px dashed #000;padding-top:4px;margin-top:6px">User: ${E(b.user)}<br>${b.dt}</div></div>`;
$('pr').innerHTML='<div class="pair">'+cp('DISTRIBUTION COPY')+cp('CUSTOMER COPY')+'</div>';$('pw').classList.add('on');$('pw').scrollTop=0}
function prn(){const it=items(),nm=$('bname').value.trim();if(!nm||!it.length)return alert('Shop name aur products likhein');
const o=OM[$('bid').value.trim()],sid=o?o.ID:'',ds=N($('bdi').value),sub=it.reduce((a,x)=>a+x.a,0),id=Date.now(),dt=nowS(),addr=$('baddr').value.trim(),ph=$('bph').value.trim();
op('add',{s:'Bills',row:{ID:id,DateTime:dt,User:S.u,ShopID:sid,Shop:nm,Items:JSON.stringify({i:it,a:addr,p:ph}),Discount:ds,Total:sub-ds}});
pb({no:'INV-'+String(id).slice(-6),dt,user:S.name,ShopID:sid,Shop:nm,addr,ph,items:it,ds});
$('bit').innerHTML='';addI();['bdi','btot','bid','bname','baddr','bph'].forEach(i=>$(i).value='');$('binf').innerHTML=''}
function bh(){const id=$('bsid').value.trim(),f=$('bsf').value,t=$('bst').value;
BR=D.b.filter(b=>{const d=String(b.DateTime).slice(0,10);return(!id||b.ShopID==id)&&(!f||d>=f)&&(!t||d<=t)}).reverse();const sum=BR.reduce((a,b)=>a+N(b.Total),0);
$('bl').innerHTML=`<small>${BR.length} bills | Total: <b>${F(sum)}</b></small><table><tr><th>Bill<th>Date<th>Shop<th>Total<th></tr>${BR.slice(0,50).map((b,i)=>`<tr><td>${String(b.ID).slice(-6)}<td>${b.DateTime}<td>${E(b.Shop)}<td>${F(b.Total)}<td><button onclick="reprint(${i})">Print</button></tr>`).join('')}</table>`}
function reprint(i){const r=BR[i],q=bparse(r),o=OM[r.ShopID]||{};pb({no:'INV-'+String(r.ID).slice(-6),dt:r.DateTime,user:r.User,ShopID:r.ShopID,Shop:r.Shop,addr:q.addr||o.Address||'',ph:q.ph||o.Phone||'',items:q.it,ds:N(r.Discount)})}
function bcsv(){dl('bills',[['Bill','DateTime','User','ShopID','Shop','Items','Discount','Total'],...BR.map(b=>[b.ID,b.DateTime,b.User,b.ShopID,b.Shop,bparse(b).it.map(x=>x.p+' x'+x.q+' @'+x.r).join('; '),b.Discount,b.Total])])}
async function cpass(){const p=prompt('Naya password:');if(p){const r=await call('pass',{np:p});if(r.ok){S.p=p;sessionStorage.s=JSON.stringify(S);alert('Password badal gaya')}}}
function rpw(u){const p=prompt(u+' ka naya password:');if(p)op('upd',{s:'Users',id:u,row:{Password:p,WrongAttempts:0}})}
function tgl(u,s){op('upd',{s:'Users',id:u,row:{Status:s=='Active'?'Blocked':'Active',WrongAttempts:0}})}
async function addU(){const row={UserName:$('nu').value.trim(),Password:$('np').value,FullName:$('nf').value,Role:$('nr').value,Status:'Active',WrongAttempts:0};if(!row.UserName||!row.Password)return alert('User aur Password likhein');if(await op('add',{s:'Users',row}))['nu','np','nf'].forEach(i=>$(i).value='')}
async function setAnn(){if(await op('setAnn',{text:$('an').value}))alert('Announcement lag gayi')}
if(S){start()}
</script></body></html>
